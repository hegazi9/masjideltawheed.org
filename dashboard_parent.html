/* ══ Sidebar ══ */
.sidebar{position:fixed;top:0;right:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,#0f2318 0%,#143522 100%);color:#fff;display:flex;flex-direction:column;z-index:60;transition:transform .28s cubic-bezier(.22,1,.36,1);}

/* ══ Kids switcher ══ */

/* ══ Cards / Stats ══ */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(220,232,224,.7);margin-bottom:16px;overflow:hidden;}

.card-b{padding:16px 18px;}

.st{background:var(--white);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid rgba(220,232,224,.7);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.2s;}
.st:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.st-i{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;}

.st-s{font-size:.66rem;color:var(--light);}
.t-green .st-i{background:var(--pale);color:var(--jade);} .t-green .st-v{color:var(--jade);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

.p-green{background:var(--pale);color:var(--jade);} .p-red{background:var(--red-pale);color:var(--red);}
.p-gold{background:var(--gold-pale);color:var(--gold);} .p-blue{background:var(--blue-pale);color:var(--blue);}
.p-gray{background:#eef2ef;color:var(--mid);} .p-purple{background:var(--purple-pale);color:var(--purple);}

.bg-blue{background:var(--blue-pale);color:var(--blue);} .bg-gray{background:#eef2ef;color:var(--mid);}
.list{display:flex;flex-direction:column;}
.li{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #eef3f0;}
.li:last-child{border-bottom:none;}
.li-i{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.li-m{flex:1;min-width:0;}
.li-t{font-size:.86rem;font-weight:800;color:var(--forest);}
.li-s{font-size:.72rem;color:var(--light);margin-top:2px;line-height:1.5;}
.li-e{text-align:left;flex-shrink:0;}
.empty{text-align:center;padding:34px 18px;color:var(--light);font-size:.86rem;}
.empty .ic{width:42px;height:42px;color:var(--border);margin-bottom:8px;}
.err{color:var(--red);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:10px 16px;font-size:.85rem;font-weight:800;transition:.18s;}
.btn-p{background:linear-gradient(135deg,var(--emerald),var(--jade));color:#fff;box-shadow:0 4px 14px rgba(30,92,54,.25);}
.btn-p:hover{transform:translateY(-1px);}
.btn-o{background:var(--white);border:1.5px solid var(--border);color:var(--emerald);}
.btn-sm{padding:7px 12px;font-size:.78rem;border-radius:9px;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.tabs{display:flex;gap:6px;background:#eef3f0;border-radius:12px;padding:4px;margin-bottom:14px;width:fit-content;max-width:100%;overflow-x:auto;}
.tab{padding:7px 14px;border-radius:9px;font-size:.8rem;font-weight:800;color:var(--mid);white-space:nowrap;}
.tab.on{background:var(--white);color:var(--emerald);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.ring{--v:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--rc,var(--jade)) calc(var(--v)*1%),#e9f0ec 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring b{font-size:1.2rem;font-weight:900;color:var(--forest);} .ring small{font-size:.62rem;color:var(--light);}
.bar{height:8px;border-radius:99px;background:#e9f0ec;overflow:hidden;} .bar>i{display:block;height:100%;border-radius:99px;}
.sp-tbl{width:100%;border-collapse:collapse;font-size:.78rem;}
.sp-tbl th{background:var(--pale);color:var(--forest);padding:7px 8px;border:1px solid var(--border);font-weight:800;white-space:nowrap;}
.sp-tbl td{padding:6px 8px;border:1px solid var(--border);text-align:center;}

/* ══ Prayers ══ */
.wk{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.wk-t{flex:1;text-align:center;font-weight:800;color:var(--forest);font-size:.92rem;}
.wk-t small{display:block;font-size:.7rem;color:var(--light);font-weight:600;}
.wk-b{width:40px;height:40px;border-radius:12px;background:var(--white);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--emerald);}

.dchip i{display:block;height:5px;border-radius:99px;background:#e9f0ec;margin:3px 8px 0;overflow:hidden;} .dchip i>em{display:block;height:100%;background:var(--jade);}
.dchip.on{border-color:var(--kc);background:var(--kp);}
.dchip.fut{opacity:.4;}
.dchip.today span{color:var(--kc);}
.prow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #eef3f0;}
.prow:last-child{border-bottom:none;}
.prow-n{width:86px;flex-shrink:0;font-weight:800;color:var(--forest);font-size:.88rem;display:flex;align-items:center;gap:6px;}
.prow-n small{display:block;font-size:.64rem;color:var(--light);font-weight:600;}
.seg{flex:1;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}

.opt:hover:not(:disabled){border-color:var(--light);}
.opt:disabled{cursor:default;}

.opt.o-prayed.on{background:var(--jade);border-color:var(--jade);color:#fff;}
.opt.o-missed.on{background:var(--red);border-color:var(--red);color:#fff;}

.sv-ok{color:var(--jade);} .sv-busy{color:var(--gold);} .sv-err{color:var(--red);}

.bd-r.r1{background:linear-gradient(135deg,#f0b429,#c8920a);color:#fff;} .bd-r.r2{background:linear-gradient(135deg,#cfd8dc,#90a4ae);color:#fff;} .bd-r.r3{background:linear-gradient(135deg,#e0a577,#b36b39);color:#fff;}
.bd-n{flex:1;font-weight:700;font-size:.86rem;} .bd-p{font-weight:900;color:var(--gold);}

/* ══ Inbox ══ */
.msg{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid #eef3f0;cursor:pointer;}
.msg:hover{background:#fafcfb;}

/* ══ Modal / Toast / Form ══ */
.overlay{position:fixed;inset:0;background:rgba(10,20,14,.5);backdrop-filter:blur(3px);z-index:90;display:none;align-items:center;justify-content:center;padding:16px;}
.overlay.open{display:flex;}
.modal{background:var(--white);border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:fadeUp .3s;}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white);}
.modal-t{font-weight:800;color:var(--forest);flex:1;}
.modal-x{width:34px;height:34px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mid);}
.modal-b{padding:18px;}
.fg{margin-bottom:13px;} .fg label{display:block;font-size:.8rem;font-weight:800;color:var(--forest);margin-bottom:6px;}
.in{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:10px 12px;font-size:.88rem;background:#fafcfb;color:var(--ink);outline:none;}
.in:focus{border-color:var(--jade);background:#fff;box-shadow:0 0 0 3px rgba(45,122,80,.1);}
textarea.in{min-height:120px;resize:vertical;line-height:1.7;}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--forest);color:#fff;padding:11px 18px;border-radius:12px;font-size:.84rem;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ══ Bottom nav (موبايل) ══ */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(15,35,24,.06);}
.bnav-in{display:flex;justify-content:space-around;}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--light);font-size:.66rem;font-weight:800;position:relative;}
.bn.active{color:var(--emerald);}
.bn.active .ic{stroke-width:2.3;}
.bn.active::before{content:"";position:absolute;top:-6px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--emerald);}
.boot{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mid);font-weight:700;}
.boot img{width:74px;height:74px;border-radius:50%;animation:pulse 1.4s infinite;}
@keyframes pulse{50%{transform:scale(.93);opacity:.7;}}

@media (max-width:980px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .grid2{grid-template-columns:1fr;}
}
@media (max-width:900px){
  .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.25);}
  .main{margin-right:0;padding-bottom:84px;}
  .tb-menu{display:flex;}
  .bnav{display:block;}
  .topbar{padding:0 14px;}
  .wrap{padding:14px 14px;}
}
@media (max-width:520px){
  .tb-title{font-size:.95rem;}
  .tb-term{max-width:120px;font-size:.72rem;padding:6px 8px;}
  .hero{padding:18px 16px;}
  .hero-n{font-size:1.25rem;}
  .hero-av{width:48px;height:48px;font-size:1.25rem;}
  .prow{flex-direction:column;align-items:stretch;gap:8px;}
  .prow-n{width:auto;}
  .seg{justify-content:stretch;}
  .opt{flex:1;justify-content:center;padding:10px 6px;}
  .st-v{font-size:1.25rem;}
}
</style>
</head>

async function secureLogout(){
  try{ if(window.db && db.auth) await db.auth.signOut(); }catch(e){ console.warn('signOut',e); }
  try{ localStorage.removeItem('currentUser'); }catch(e){}
  window.location.href='login.html';
}
async function verifyMe(allowedRoles){
  try{
    const { data:{ session } } = await db.auth.getSession();
    if(!session){ await secureLogout(); return null; }
    const { data:me, error } = await db.from('users').select('*').eq('auth_id', session.user.id).eq('is_active', true).maybeSingle();
    if(error) throw error;
    if(!me || (allowedRoles && !allowedRoles.includes(me.role))){ await secureLogout(); return null; }

    return me;
  }catch(e){
    showToast('⚠️ تعذّر التحقق من الحساب — تأكد من الاتصال');
    return null;
  }

  ex.forEach((d,i)=>{ if(d>=from){ out.push({no:i+1, from, to:d, exam:d}); from=spAddDays(d,1); } });
  if(!out.length) out.push({no:1, from:t.start_date, to:t.end_date, exam:null});
  return out;
}
function spPeriodOf(periods,iso){
  return periods.find(p=>p.from<=iso&&iso<=p.to) || periods.find(p=>p.from>iso) || periods[periods.length-1] || null;
}
// أيام الحلقات جوه الفترة (من غير يوم الاختبار)
function spSessionDates(t,branch,from,to){
  const days=termDays(t,branch); if(!days.length) return [];
  const exd=new Set((((t.settings||{}).exams||{}).dated||[]).filter(e=>Array.isArray(e.branches)&&e.branches.includes(branch)).map(e=>e.date));
  const out=[]; let d=from;
  while(d<=to){ const dow=new Date(d+'T00:00:00').getDay(); if(days.includes(dow)&&!exd.has(d)) out.push(d); d=spAddDays(d,1); }
  return out;
}
// ── حساب الإنجاز لمسار (حفظ h / مراجعة r) ──
function spTrack(plan,key,recs,asOf){
  const D_=plan.data||{}, tr=D_[key==='h'?'hifz':'rev']||{}, dir=plan.direction||'forward';
  if(!tr.start||!tr.start.s) return null;
  const p0=spPos(dir,tr.start.s,tr.start.a);
  const ses=(D_.sessions||[]).filter(x=>x[key]&&x[key].s).map(x=>({date:x.date, tgt:x[key], p:spPos(dir,x[key].s,x[key].a)})).sort((a,b)=>a.date<b.date?-1:1);
  if(!ses.length) return null;
  const pEnd=Math.max(...ses.map(x=>x.p)); if(pEnd<p0) return null;
  const typ=key==='h'?'new':'review';
  const rs=(recs||[]).filter(r=>r.type===typ&&r.grade!=='retry'&&r.date>=plan.period_from&&r.date<=plan.period_to).map(r=>({date:r.date, sp:spSpan(dir,r), r})).filter(x=>x.sp).sort((a,b)=>a.date<b.date?-1:1);
  const covUpTo=(dLim,pLim)=>{ const c=new Set(); rs.forEach(x=>{ if(x.date>dLim) return; for(let p=Math.max(x.sp[0],p0);p<=Math.min(x.sp[1],pLim);p++) c.add(p); }); return c.size; };
  const due=ses.filter(x=>x.date<=asOf);
  const dueP=due.length?Math.max(...due.map(x=>x.p)):p0-1;
  const planned=Math.max(0,dueP-p0+1), plannedAll=pEnd-p0+1;
  const doneAll=covUpTo(asOf,pEnd);
  const rows=ses.map(x=>{
    const need=x.p-p0+1, got=covUpTo(x.date,x.p);
    const day=rs.filter(y=>y.date===x.date).map(y=>spName(y.r.surah_to||y.r.surah_from)+' '+spAr(y.r.ayah_to||y.r.ayah_from||'')).join(' ، ');
    return { date:x.date, tgt:x.tgt, need, got, pct:need?Math.min(100,Math.round(got/need*100)):0, future:x.date>asOf, recited:day };
  });
  return { lines:tr.lines||null, start:tr.start, planned, plannedAll, done:doneAll,
           pct: planned?Math.min(100,Math.round(doneAll/planned*100)):null,
           pctAll: plannedAll?Math.min(100,Math.round(doneAll/plannedAll*100)):0, rows };
}
function spColor(p){ return p==null?'var(--light)':(p>=90?'var(--jade)':(p>=60?'var(--gold)':'var(--red)')); }
function spBadge(p){ return p==null?'<span style="color:var(--light);">—</span>':'<span style="font-weight:800;color:'+spColor(p)+';">'+spAr(p)+'٪</span>'; }

function spProgressHtml(plan,recs,asOf){
  const H=spTrack(plan,'h',recs,asOf), R=spTrack(plan,'r',recs,asOf);
  const card=(ttl,T,col)=>'<div style="flex:1;min-width:200px;border:1.5px solid var(--border);border-top:3px solid '+col+';border-radius:var(--r-sm);padding:12px 14px;background:var(--white);">'

      +'<div style="font-size:.72rem;color:var(--light);">لحد النهارده • '+spAr(T.done)+' من '+spAr(T.planned)+' آية</div></div>'+spBar(T.pct)
      +'<div style="font-size:.7rem;color:var(--mid);margin-top:6px;">الفترة كلها: '+spAr(T.pctAll)+'٪ ('+spAr(T.plannedAll)+' آية)'+(T.lines?(' • '+spAr(T.lines)+' سطر/حلقة'):'')+' • البداية: '+spLbl(T.start)+'</div>')
     :'<div style="font-size:.76rem;color:var(--light);margin-top:8px;">مفيش خطة</div>')+'</div>';
  const map={}; (H?H.rows:[]).forEach(r=>{ (map[r.date]=map[r.date]||{}).h=r; }); (R?R.rows:[]).forEach(r=>{ (map[r.date]=map[r.date]||{}).r=r; });
  const cell=x=>{ if(!x) return '<td>—</td><td>—</td>'; const st=x.future?'<span style="color:var(--light);">قادمة</span>':(x.pct>=100?'<span class="badge bg-green">✔ وصل</span>':spBadge(x.pct));

  const dates=Object.keys(map).sort();

    +dates.map(d=>'<tr><td style="white-space:nowrap;font-weight:700;">'+spFmt(d)+'</td>'+cell(map[d].h)+cell(map[d].r)+'</tr>').join('')+'</tbody></table></div>'):'';
  return '<div style="display:flex;gap:12px;flex-wrap:wrap;">'+card('📖 خطة الحفظ',H,'var(--jade)')+card('🔁 خطة المراجعة',R,'var(--blue)')+'</div>'+tbl
    +(plan.data&&plan.data.notes?'<div style="font-size:.76rem;color:var(--mid);margin-top:10px;">📝 '+esc(plan.data.notes)+'</div>':'');
}

// نسبة إجمالية لطالب على مجموعة خطط (للإحصاءات)
function spAggPct(plans,recs,key,asOf){
  let d=0,p=0; plans.forEach(pl=>{ const T=spTrack(pl,key,recs.filter(r=>String(r.student_id)===String(pl.student_id)),asOf); if(T){ d+=Math.min(T.done,T.planned); p+=T.planned; } });
  return p?Math.round(d/p*100):null;
}

function prSummary(rows){

function nextSession(){
  const t=CUR_TERM; if(!t||!KID) return null;
  const sch=termSched(t,KID.branch); if(!sch.length) return null;
  const now=new Date(); let d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<14;i++){
    const iso=localISO(d);
    if(iso>=t.start_date&&iso<=t.end_date){
      const w=sch.find(x=>x.d===d.getDay());
      if(w){ const end=new Date(d); end.setHours(Math.floor(+w.e),Math.round((+w.e%1)*60)); if(end>now){ const ex=termExam(t,KID.branch,iso); return {iso,s:w.s,e:w.e,exam:ex?ex.kind:''}; } }
    }
    d.setDate(d.getDate()+1);
  }
  return null;
}

function prPick(d){ PR.sel=d; prRender(); }
function prShift(n){ const nw=prWeekStart(KID.branch,prAddDays(PR.ws,7*n)); if(nw>prCurWs()) return; PR.ws=nw; PR.sel=null; rPrayers(); }
function prSet(d,key,val){
  if(!prEditable(d)) return;
  const prev=Object.assign({},PR.rows[d]||{});
  const cur=Object.assign({},prev); cur[key]=(cur[key]===val)?null:val;
  prCommit(d,prev,cur);
}
function prQuick(d){
  if(!prEditable(d)) return;
  const prev=Object.assign({},PR.rows[d]||{}), cur=Object.assign({},prev), v=prIsAbtal(KID.branch)?'mosque':'prayed';
  PR_FARD.forEach(k=>{ if(!cur[k]) cur[k]=v; });
  prCommit(d,prev,cur);
}
function prCommit(d,prev,cur){
  const kid=KID.id;
  PR.rows[d]=cur; PR.state[d]='busy'; prRender();
  PR.chain=PR.chain.then(async()=>{
    const payload={student_id:kid,date:d,recorded_by:ME.id};
    PR_KEYS.forEach(([k])=>payload[k]=cur[k]||null);
    const {data,error}=await db.from('student_prayers').upsert(payload,{onConflict:'student_id,date'}).select('id');
    if(error||!data||data.length!==1) throw (error||new Error('rls'));
  }).then(()=>{ if(KID.id!==kid) return; PR.state[d]='ok'; if(PAGE==='prayers') prRender(); setTimeout(()=>{ if(PR.state[d]==='ok'){ delete PR.state[d]; if(PAGE==='prayers'&&PR.sel===d) prDay(); } },2200); })
   .catch(e=>{ console.warn(e); if(KID.id===kid){ PR.rows[d]=prev; PR.state[d]='err'; if(PAGE==='prayers') prRender(); }
     showToast('⚠️ الصلاة ما اتحفظتش — تأكد من الاتصال وجرّب تاني'); PR.chain=Promise.resolve(); });
}

  if(INBOX.err){ el.innerHTML='<div class="card">'+errBox()+'</div>'; return; }
  if(!INBOX.msgs){ el.innerHTML=skel(5); return; }
  const un=INBOX.msgs.filter(x=>String(x.to_id)===String(ME.id)&&!x.is_read).length;
  let h='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><div class="tabs">'
    +'<button class="tab'+(INB_TAB==='ann'?' on':'')+'" onclick="INB_TAB=\'ann\';rInbox();">الإعلانات ('+AR(INBOX.anns.length)+')</button>'
    +'<button class="tab'+(INB_TAB==='msg'?' on':'')+'" onclick="INB_TAB=\'msg\';rInbox();">الرسائل'+(un?' ('+AR(un)+' جديدة)':'')+'</button></div>'
    +'<div style="margin-right:auto;margin-bottom:14px;"><button class="btn btn-p btn-sm" onclick="openCompose()">'+ic('edit','sm')+' رسالة جديدة</button></div></div>';
  if(INB_TAB==='ann'){
    h+='<div class="card">'+(INBOX.anns.length?INBOX.anns.map(a=>'<div class="ann"><div class="ann-t">'+ic('megaphone','sm')+esc(a.title||'إعلان')+'</div><div class="ann-b">'+esc(a.body||'')+'</div><div class="ann-d">'+fmtDT(a.created_at)+'</div></div>').join(''):emptyBox('megaphone','مفيش إعلانات لأولياء الأمور لحد دلوقتي'))+'</div>';
  }else{
    h+='<div class="card">'+(INBOX.msgs.length?INBOX.msgs.map(m=>{ const mine=String(m.sender_id)===String(ME.id), unread=!mine&&!m.is_read;
      return '<div class="msg'+(unread?' unread':'')+'" onclick="openMsg('+(+m.id)+')"><div class="li-i" style="background:'+(mine?'var(--bg)':'var(--pale)')+';color:'+(mine?'var(--light)':'var(--emerald)')+';">'+ic(mine?'send':'mail')+'</div><div class="li-m"><div class="li-t">'+(mine?'إلى: '+esc(m.to_name||''):esc(m.sender_name||''))+'</div><div class="li-s"><b>'+esc(m.subject||'(بدون موضوع)')+'</b> — '+esc(String(m.body||'').slice(0,70))+'</div></div><div class="li-e" style="font-size:.66rem;color:var(--light);">'+fmtDT(m.created_at).split(' • ')[0]+(unread?'<div><span class="pill p-green" style="margin-top:4px;">جديدة</span></div>':'')+'</div></div>'; }).join(''):emptyBox('mail','مفيش رسائل — تقدر تبعت رسالة لـ'+kidWord('معلم ابنك','معلمة بنتك')))+'</div>';
  }
  el.innerHTML=h;
}
async function openMsg(id){
  const m=(INBOX.msgs||[]).find(x=>+x.id===+id); if(!m) return;
  const mine=String(m.sender_id)===String(ME.id);
  $('msg-mt').textContent=m.subject||'(بدون موضوع)';
  $('msg-mb').innerHTML='<div style="font-size:.78rem;color:var(--mid);margin-bottom:10px;">'+(mine?'إلى: <b>'+esc(m.to_name||'')+'</b>':'من: <b>'+esc(m.sender_name||'')+'</b>')+' • '+fmtDT(m.created_at)+'</div>'
    +'<div style="white-space:pre-wrap;line-height:1.9;font-size:.9rem;background:var(--bg);border-radius:12px;padding:14px;">'+esc(m.body||'')+'</div>'
    +(mine?'':'<button class="btn btn-p" style="width:100%;margin-top:14px;" onclick="replyMsg('+(+m.id)+')">'+ic('reply','sm')+' رد</button>');
  openModal('modal-msg');
  if(!mine&&!m.is_read){
    try{ const {data,error}=await db.from('messages').update({is_read:true}).eq('id',m.id).eq('to_id',String(ME.id)).select('id'); if(!error&&data&&data.length){ m.is_read=true; inboxBadge(); if(PAGE==='inbox') rInbox(); } }catch(e){ console.warn(e); }
  }
}
function recipients(){
  const map=new Map();
  KIDS.forEach(k=>{ if(k.teacher_id&&!map.has(String(k.teacher_id))) map.set(String(k.teacher_id),{id:String(k.teacher_id),name:k.teacher||'المعلم',role:'teacher',lbl:(termIsGirls(k.branch)?'معلمة ':'معلم ')+first(k.name)}); });
  (INBOX.msgs||[]).forEach(m=>{ if(String(m.to_id)===String(ME.id)&&m.sender_id&&!map.has(String(m.sender_id))) map.set(String(m.sender_id),{id:String(m.sender_id),name:m.sender_name||'',role:m.sender_role||'admin',lbl:m.sender_role==='admin'?'الإدارة':(m.sender_role==='supervisor'?'المشرف':'')}); });
  return [...map.values()];
}
function openCompose(toId,subj){
  const R=recipients(); if(!R.length){ showToast('مفيش جهة متاحة للمراسلة لسه'); return; }
  $('cm-to').innerHTML=R.map(r=>'<option value="'+esc(r.id)+'"'+(String(toId)===r.id?' selected':'')+'>'+esc(r.name)+(r.lbl?' — '+esc(r.lbl):'')+'</option>').join('');
  $('cm-subj').value=subj||''; $('cm-body').value='';
  closeModal('modal-msg'); openModal('modal-compose');
}
function replyMsg(id){ const m=(INBOX.msgs||[]).find(x=>+x.id===+id); if(!m) return; openCompose(String(m.sender_id),(/^رد:/.test(m.subject||'')?'':'رد: ')+(m.subject||'')); }
async function sendMsg(){
  const to=$('cm-to').value, R=recipients().find(r=>r.id===to), subj=$('cm-subj').value.trim(), body=$('cm-body').value.trim();
  if(!R){ showToast('اختار المستلم'); return; }
  if(!body){ showToast('اكتب الرسالة'); return; }
  const b=$('cm-send'); b.disabled=true;
  try{
    const row={subject:subj||'(بدون موضوع)',body,sender_id:String(ME.id),sender_name:ME.full_name,sender_role:'parent',to_id:R.id,to_name:R.name,to_role:R.role,is_read:false,starred:false,urgent:false,is_draft:false,deleted:false};
    const {data,error}=await db.from('messages').insert(row).select('id,created_at');
    if(error||!data||data.length!==1) throw (error||new Error('rls'));
    closeModal('modal-compose'); showToast('✅ الرسالة اتبعتت');
    INBOX.msgs.unshift(Object.assign(row,data[0])); INB_TAB='msg'; if(PAGE==='inbox') rInbox();
  }catch(e){ console.warn(e); showToast('⚠️ الرسالة ما اتبعتتش — جرّب تاني'); }
  finally{ b.disabled=false; }
}

// ══ الإعدادات ══
function rSettings(){
  pg('settings').innerHTML='<div class="grid2"><div class="card">'+cardH('user','بيانات الحساب')+'<div class="list">'
    +'<div class="li"><div class="li-m"><div class="li-t">الاسم</div></div><div class="li-e">'+esc(ME.full_name||'')+'</div></div>'
    +'<div class="li"><div class="li-m"><div class="li-t">كود الدخول</div></div><div class="li-e" style="direction:ltr;font-weight:800;">'+esc(String(ME.username||'').split('@')[0])+'</div></div>'
    +'<div class="li"><div class="li-m"><div class="li-t">الأبناء</div></div><div class="li-e">'+KIDS.map(k=>esc(first(k.name))).join(' • ')+'</div></div></div></div>'
    +'<div class="card">'+cardH('lock','تغيير كلمة المرور')+'<div class="card-b">'
    +'<div class="fg"><label>كلمة المرور الجديدة</label><input class="in" type="password" id="np1" autocomplete="new-password" placeholder="٦ أرقام أو حروف على الأقل" style="direction:ltr;text-align:right;"></div>'
    +'<div class="fg"><label>تأكيد كلمة المرور</label><input class="in" type="password" id="np2" autocomplete="new-password" style="direction:ltr;text-align:right;"></div>'
    +'<button class="btn btn-p" style="width:100%;" id="np-btn" onclick="changeMyPassword()">'+ic('check','sm')+' حفظ</button></div></div></div>'
    +'<button class="btn btn-o" style="width:100%;color:var(--red);" onclick="confirmLogout()">'+ic('logout','sm')+' تسجيل الخروج</button>';
}
async function changeMyPassword(){
  const a=$('np1').value, b=$('np2').value;
  if(a.length<6){ showToast('كلمة المرور لازم ٦ على الأقل'); return; }
  if(a!==b){ showToast('كلمتين المرور مش متطابقين'); return; }
  const btn=$('np-btn'); btn.disabled=true;
  try{ const {error}=await db.auth.updateUser({password:a}); if(error) throw error; showToast('✅ كلمة المرور اتغيّرت'); $('np1').value=''; $('np2').value=''; }
  catch(e){ console.warn(e); showToast('⚠️ ما اتغيّرتش — جرّب تاني'); }
  finally{ btn.disabled=false; }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal('modal-msg'); closeModal('modal-compose'); toggleSide(false); } });
</script>
